          - "Inicié como Analista Programador, analizando gráficos y estadísticas con Google Analytics"
          - "Generación de informes y seguimiento de movimientos de usuarios usando Google Tag Manager"
          - "Creación de reportes gráficos en Excel para facilitar la toma de decisiones ejecutivas"
          - "Mantenimiento de proyecto en Lumen (Laravel) tras demostrar habilidades en JavaScript"
          - "Transición al área de desarrollo web trabajando principalmente con WordPress"
          - "Mantenimiento y corrección de bugs en múltiples webs de clientes corporativos"

