cv:
  name: Diego Silva
  headline: Desarrollador Full Stack Java - Semi Senior
  location: San José de Mayo, Uruguay
  email: diego1silva2@gmail.com
  phone: +598 97 257 167
  photo: ./foto_perfil.png

  sections:
    sobre_mi:
      - "Desarrollador Web Full Stack especializado en Java con nivel Semi-Senior. Con más de 10 años de experiencia en desarrollo de software, me apasiona crear soluciones tecnológicas robustas y seguras, especialmente en el área de identidad digital y firma electrónica."
      - "A lo largo de mi carrera, he desarrollado una fuerte capacidad para analizar problemas complejos, diseñar arquitecturas escalables y liderar migraciones tecnológicas exitosas. Mi enfoque combina el rigor técnico con una visión práctica orientada a resultados empresariales."
      - "Soy un profesional proactivo, con gran capacidad de adaptación a nuevos desafíos y tecnologías, siempre buscando optimizar procesos y mejorar la calidad del software entregado."
      - "Trabajo diariamente junto a herramientas de Inteligencia Artificial para aumentar la productividad durante el desarrollo de software. Las utilizo para acelerar la generación de código repetitivo, resolver problemas de baja complejidad, investigar nuevas tecnologías, validar enfoques de implementación y desarrollar herramientas internas que optimizan mi flujo de trabajo."
      - "Tengo conocimientos sobre AI Harness Engineering, incluyendo la definición de habilidades (skills), el diseño de flujos con orquestadores y subagentes especializados para distintas tareas, permitiendo dividir responsabilidades y mejorar la calidad de las respuestas y automatizaciones."
      - "Además, utilizo Gentle AI junto con Engram para mantener contexto persistente de mis proyectos y el cliente OpenCode para asistir el desarrollo y la gestión del contexto técnico durante la programación."

    experiencia_detallada:
      - company: ISA INTERFASE (6+ años)
        position: Desarrollador Full Stack - Especialista en Seguridad Digital
        start_date: 2019
        end_date: 2025
        location: Montevideo, Uruguay
        summary: Desarrollo de soluciones de identidad digital, firma electrónica y autenticación segura
        highlights:
          - "Lideré el desarrollo y mantenimiento de aplicaciones de firma digital integradas con sistemas de autenticación externos como TuID de Antel"
          - "Desarrollo de la plataforma MiRecibo para firma digital de recibos de sueldo con roles diferenciados y configuraciones por empresa"
          - "Creación y gestión de certificados digitales para firmar documentos PDF y XML de forma segura"
          - "Implementación de servicios de autenticación OAuth2 y desarrollo de APIs seguras para aplicaciones críticas"
          - "Integración con HSM (Hardware Security Module) para automatizar emisión, firma y revocación de certificados"
          - "Participación en la evolución arquitectónica interna hacia microservicios y sistemas distribuidos"
          - "Trabajo en entorno de producción con alta disponibilidad y exigentes requisitos de seguridad"

      - company: Beacon42
        position: Desarrollador Magento - Especialista eCommerce
        start_date: 2018
        end_date: 2019
        location: Montevideo, Uruguay
        summary: Desarrollo de soluciones eCommerce personalizadas para Magento
        highlights:
          - "Desarrollo desde cero de un plugin de Magento para gestión de flujo de facturación (billing)"
          - "Implementación de integraciones personalizadas para plataformas de comercio electrónico"
          - "Aprendizaje profundo del ecosistema Magento y arquitecturas de eCommerce"
          - "Colaboración en el crecimiento de una startup en expansión"

